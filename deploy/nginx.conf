limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;   # второй рубеж rate limit

server { listen 80; return 301 https://$host$request_uri; }

server {
    listen 443 ssl http2;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;                                # без SSLv3/TLS1.0/1.1
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;                                # PFS: только ECDHE
    ssl_session_tickets off;
    ssl_stapling on;
    server_tokens off;
    client_max_body_size 128k;

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location / { proxy_pass http://api:8000; include /etc/nginx/conf.d/proxy.inc; }
}
